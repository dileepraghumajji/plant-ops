# Headers every proxied request carries, in one place so the two `location`
# blocks in `nginx.conf` cannot drift apart.
#
# ## The one that matters: X-Forwarded-For
#
# `$remote_addr`, **not** `$proxy_add_x_forwarded_for`.
#
# The difference is the whole rate limiter. `$proxy_add_x_forwarded_for` appends
# the peer address to whatever the client sent, so a caller who sends
# `X-Forwarded-For: 10.0.0.1` gets `10.0.0.1, <their real ip>` — and with
# `TRUST_PROXY=true` the API trusts the *leftmost* entry, which the caller chose.
# Every request could then pick its own rate-limit bucket, which is the same as
# having no IP rate limiting at all. `libs/config/src/env.schema.ts` warns about
# exactly this on `TRUST_PROXY`, and this line is what makes the warning
# satisfiable: the header is **replaced**, so what reaches the API is the address
# nginx actually accepted the connection from.
#
# `TRUST_PROXY=true` is therefore correct behind this proxy, and only behind a
# proxy that does this. It is wrong for an API exposed directly.
#
# ### When something else is in front of this proxy
#
# If the client terminates TLS on their own load balancer, `$remote_addr` is
# that balancer and every unauthenticated caller shares one bucket — safe, but
# blunt: it is the plant's logins that share it, since authenticated requests
# are keyed by subject rather than by address (`common/throttler.guard.ts`).
# Set `TRUSTED_PROXY_CIDRS` on this container to the balancer's range and
# `40-real-ip.sh` configures nginx's realip module, which rewrites `$remote_addr`
# from the incoming header *before* the line below reads it. Trust is then
# explicit and bounded to named networks, which is the only form of it worth
# having.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;

# The hostname the browser asked for, so the upstream can build absolute URLs
# that point back at the origin the user is actually on rather than at
# `iam-api:3000`.
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Host $host;

# `$scheme` is this proxy's scheme, which is `http` inside the stack even when
# the client arrived over TLS at something in front. Nothing in the API branches
# on it today; when something does, an operator with an outer terminator will
# need to pin this to `https`.
proxy_set_header X-Forwarded-Proto $scheme;

# HTTP/1.1 with the hop-by-hop `Connection` header cleared, so upstream
# keep-alive works instead of a new TCP connection per request.
proxy_http_version 1.1;
proxy_set_header Connection "";
