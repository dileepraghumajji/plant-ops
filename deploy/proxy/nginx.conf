# The bundled reverse proxy (roadmap Session 41, Doc 11 §8 gap 2).
#
# Copied to `/etc/nginx/conf.d/default.conf`, replacing the stock welcome page.
# The filename here says `nginx.conf` because that is what it is *about*; the
# stock `/etc/nginx/nginx.conf` is left alone so the image's own entrypoint
# scripts — log symlinks, worker tuning, IPv6 detection — keep working.
#
# ## What it exists to do
#
# Session 40 made the console call the same-origin path `/api`. This is the
# other half: something has to *be* at that path. One origin serves both, so
#
#   * the browser sends no cross-origin request, needs no preflight, and the API
#     needs no `CORS_ALLOWED_ORIGINS` entry at all;
#   * the console image carries no hostname, which is what lets one image set
#     serve every customer (Doc 11 §3).
#
# Nothing in this file names a customer either. `server_name _` answers to
# whatever hostname arrives, which is what makes the CI smoke's two-hostname
# test pass against a single digest.
#
# ## TLS
#
# Deliberately absent. Doc 11 §5.1: the client terminates TLS with their own
# certificate, in front of this proxy. Baking a certificate path in here would
# be a per-customer value in an image that must not have one, and generating a
# self-signed one would train operators to click through a warning.

# Docker's embedded DNS. Named upstreams are resolved *per request* below rather
# than once at startup, which matters more than it looks: nginx normally caches
# the address it resolved at config load, so restarting `iam-api` — an upgrade,
# an OOM kill, a compose `up` that recreates it — hands it a new container IP
# that this proxy would go on ignoring, 502-ing every request until someone
# thought to restart the proxy too.
#
# 127.0.0.11 is the resolver inside any user-defined Docker network, which is
# what compose creates. Somewhere else — Kubernetes, a plain bridge — this line
# is the one to change.
resolver 127.0.0.11 valid=30s ipv6=off;

# `/api/foo?bar` → `/foo?bar`, prefix stripped, everything else byte-for-byte.
#
# Built from `$request_uri` rather than from a `location` capture on purpose.
# `$uri` is normalised and percent-*decoded*, so rebuilding an upstream URL from
# it re-sends decoded bytes on the request line and quietly mangles anything
# encoded. `$request_uri` is exactly what the client sent, query string included.
#
# The prefix is stripped because the API has no global prefix: Doc 06 §1 fixes
# its routes at `/iam`, `/auth`, `/health` and `/ready`, and `main.ts` says in
# so many words that a prefix there would silently move every documented path.
map $request_uri $api_request_uri {
    "~^/api(?<api_rest>/.*)$"  $api_rest;
    default                    /;
}

server {
    listen 80;
    listen [::]:80;

    # Any hostname. See the header — this is the property CI tests.
    server_name _;

    # Nginx's default is 1 MB, which is smaller than the API's own manifest
    # ceiling (4 MB by default, 16 MB maximum — `libs/config/src/env.schema.ts`).
    # Left at the default, a large manifest upload would be refused *here*, with
    # an nginx 413 that names no field, instead of reaching the validator that
    # can say what is wrong with it. The proxy should never be the component
    # that sets a limit; it matches the highest the API can be configured to
    # accept and lets the API refuse for a reason.
    client_max_body_size 16m;

    # Belt and braces on an admin console. Neither is a substitute for the
    # API's own controls; both are free here and impossible to add later from
    # inside a client's network.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # The proxy's own liveness — is nginx up — and nothing more. It answers
    # without touching either upstream, which is the point: a compose
    # healthcheck on this endpoint tells you the front door is open, and
    # `/api/ready` tells you whether the stack behind it can serve.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ── The API ────────────────────────────────────────────────────────────
    location /api/ {
        set $iam_api_upstream "http://iam-api:3000";
        proxy_pass $iam_api_upstream$api_request_uri;

        include /etc/nginx/proxy-headers.conf;

        # A login pays for an argon2id hash (Doc 03 §2) and a manifest upload
        # validates a few thousand rows; 60s is generous for both and short
        # enough that a wedged upstream does not hold connections all day.
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ── The console ────────────────────────────────────────────────────────
    location / {
        set $admin_web_upstream "http://admin-web:4200";
        proxy_pass $admin_web_upstream$request_uri;

        include /etc/nginx/proxy-headers.conf;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
