# The single-tenant stack (roadmap Session 41, Doc 11 §5.1).
#
#   proxy  →  admin-web  +  iam-api  →  postgres  +  redis
#
# Four images of ours and two of theirs, assembled into the topology Doc 11
# draws. `docker compose up -d` from this directory, with a filled-in `.env`
# beside it, is a working install: Postgres initialises with both roles, the
# migration runner applies the schema and exits, and only then does the API
# start.
#
# ## What this file is and is not
#
# It is the stack CI asserts against — `.github/workflows/ci.yml` builds the
# four images, brings this up, and logs in through the proxy under two different
# hostnames. Nothing here is a demo shortcut; it is the arrangement a dedicated
# instance runs.
#
# It is **not** the offline production bundle. That is Session 42:
# `docker-compose.prod.yml` alongside a `.env.template` documenting every
# variable, our images pinned by digest rather than by tag, loaded from a
# tarball on a machine with no egress, and a bootstrap script that provisions
# roles against whichever Postgres the client already runs. Until then this file
# carries the same topology with tags instead of digests and a bundled database.
#
# ## The port surface, which is deliberate
#
# Only the proxy publishes anything. Postgres, Redis, the API and the console
# are reachable on the compose network and nowhere else, so a stack on a plant
# server exposes exactly one TCP port and everything behind it is unroutable
# from the network nobody has thought about yet. Adding `ports:` to `iam-api`
# for a quick debugging session undoes that, and undoes it silently — `docker
# compose exec` and `docker compose logs` answer the same questions without
# opening anything.
name: plantops-stack

services:
  # ── Data ───────────────────────────────────────────────────────────────────
  postgres:
    # Digest-pinned, like our own images: a stack a client rebuilds in a year
    # should get the database server it was tested against, not whatever
    # `postgres:17` points at that week.
    image: postgres:17@sha256:e38411452a464af89e5adadb8d223bf53b898d47d6ef918b2d58c08707350449
    restart: unless-stopped
    environment:
      # The **owner**: owns the schema, runs migrations, and never serves a
      # request. `DATABASE_DIRECT_URL` carries it and nothing else does.
      POSTGRES_USER: ${POSTGRES_USER:-plantops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-plantops_iam}
      # Read by `postgres-init/10-roles.sh` to create the non-owning runtime
      # role the application connects as.
      PLANTOPS_APP_ROLE: ${PLANTOPS_APP_ROLE:-plantops_app}
      PLANTOPS_APP_PASSWORD: ${PLANTOPS_APP_PASSWORD:?PLANTOPS_APP_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs once, when the data directory is empty. See the script.
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
      # Outside `initdb.d` on purpose — Postgres's own entrypoint would
      # otherwise run this file itself, without the psql variables it needs.
      - ../tools/setup-db-roles.sql:/opt/plantops/setup-db-roles.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7@sha256:91d0f7e8c748ec7a4c2b4fb2c4f84edab794dd91d01e095e38dc906db9d684ab
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  # ── Schema ─────────────────────────────────────────────────────────────────
  #
  # Runs to completion and exits; `iam-api` waits for that exit to be a success.
  # This is the ordering rule of `docs/ops-runbook.md` §3 expressed as a
  # dependency instead of as a pipeline step: migrations land before the code
  # that expects them, and a failed migration means the API never starts rather
  # than starting against a half-applied schema.
  #
  # Safe on every `up`, not only the first: the runner treats "nothing to apply"
  # as success and takes an advisory lock so two of them cannot race.
  migrate:
    image: plantops/migrate:${PLANTOPS_VERSION:-dev}
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # The **direct**, owning connection. The runner validates only this
      # subset of the environment — no signing key, no Redis, no application
      # credentials — so a compromised upgrade job holds none of them.
      DATABASE_DIRECT_URL: postgresql://${POSTGRES_USER:-plantops}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-plantops_iam}
      DATABASE_SSL: 'false'
      # Read by migration 0011 on the very first run of a new database, and by
      # nothing afterwards. Doc 07 §8: rotate it immediately after first use.
      PLATFORM_BOOTSTRAP_SECRET: ${PLATFORM_BOOTSTRAP_SECRET:?PLATFORM_BOOTSTRAP_SECRET is required}
      # Read by migration 0019, which provisions the restricted on-prem operator
      # identity in `single_tenant` mode and nothing at all otherwise (Doc 11
      # §6.4). Passed explicitly because this file lists its environment rather
      # than taking `env_file` — without it the two stacks would seed differently
      # from the same `.env`, which is the kind of divergence nobody finds until
      # an install behaves unlike CI.
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-saas}

  # ── The release's application catalog ──────────────────────────────────────
  #
  # The second half of an upgrade (roadmap Session 43, Doc 11 §6.3): manifests
  # ship with the release and are applied through the ordinary endpoint, so the
  # permission and navigation catalog on a box is always the one this version
  # was tested with — and re-converges if anyone has edited it by hand.
  #
  # A profile, so `docker compose up` never runs it implicitly. Unlike the
  # migration it needs the **API** to be serving, and unlike the migration it
  # needs a platform credential, so it is a step something explicit takes:
  # `./bootstrap.sh --apply-manifests`, or
  # `docker compose run --rm manifests` by hand.
  manifests:
    image: plantops/migrate:${PLANTOPS_VERSION:-dev}
    profiles: ['tools']
    restart: 'no'
    entrypoint: ['tsx', 'apply-manifests.ts']
    depends_on:
      iam-api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # Through the proxy, on the stack's own network — the same path a browser
      # takes, prefix stripping included.
      IAM_API_URL: http://proxy/api
      PLATFORM_BOOTSTRAP_SECRET: ${PLATFORM_BOOTSTRAP_SECRET:-}

  # ── Application ────────────────────────────────────────────────────────────
  iam-api:
    image: plantops/iam-api:${PLANTOPS_VERSION:-dev}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: '3000'
      # Two roles, one server. The app connects as a role that owns nothing, so
      # every RLS policy applies to it (Doc 07 §5.1). Pointing both variables at
      # the owner would disable them all — silently, which is why `libs/db`
      # refuses to boot if you do.
      DATABASE_URL: postgresql://${PLANTOPS_APP_ROLE:-plantops_app}:${PLANTOPS_APP_PASSWORD}@postgres:5432/${POSTGRES_DB:-plantops_iam}
      DATABASE_DIRECT_URL: postgresql://${POSTGRES_USER:-plantops}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-plantops_iam}
      # The bundled Postgres speaks no TLS and never leaves the compose network.
      # A client pointing this stack at their own database server sets both this
      # and a CA — Session 46 is what makes that configuration honest.
      DATABASE_SSL: 'false'
      REDIS_URL: redis://redis:6379
      # Correct **because** of the proxy in front, and only because of it: it
      # replaces `X-Forwarded-For` rather than appending to it, so the address
      # the rate limiter buckets on is one nginx accepted rather than one a
      # caller chose. See `deploy/proxy/proxy-headers.conf`.
      TRUST_PROXY: 'true'
      # Empty, and correctly empty. The console reaches the API at `/api` on its
      # own origin, so the browser sends no cross-origin request and there is
      # nothing to allow (Doc 11 §8, gap 2).
      CORS_ALLOWED_ORIGINS: ''
      JWT_ISSUER: ${JWT_ISSUER:-plantops-iam}
      JWT_SIGNING_KEY_ID: ${JWT_SIGNING_KEY_ID:?JWT_SIGNING_KEY_ID is required}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?JWT_PRIVATE_KEY is required}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY is required}
      PLATFORM_BOOTSTRAP_SECRET: ${PLATFORM_BOOTSTRAP_SECRET}
      # Deliberately absent: APP_VERSION. It is baked into the image and
      # reported by `/health`; setting it here would let a stack claim a version
      # it is not running, which is the one thing the stamp exists to prevent.

  admin-web:
    image: plantops/admin-web:${PLANTOPS_VERSION:-dev}
    restart: unless-stopped
    # No `environment:` at all, and that is this stack's headline property
    # rather than an omission. The console image holds no hostname, no API URL
    # and no customer name — it asks its own origin for `/api` — which is what
    # lets one image serve every deployment (Doc 11 §3). Anything added here
    # would be the beginning of a per-customer build.

  # ── Front door ─────────────────────────────────────────────────────────────
  proxy:
    image: plantops/proxy:${PLANTOPS_VERSION:-dev}
    restart: unless-stopped
    depends_on:
      - iam-api
      - admin-web
    ports:
      - '${PLANTOPS_HTTP_PORT:-8080}:80'
    environment:
      # Unset by default: this proxy is the outermost hop, so no caller's
      # `X-Forwarded-For` is believed. Set it to the CIDR of the load balancer
      # or ingress that terminates TLS in front of this stack, and only to that.
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}

volumes:
  postgres-data:
  redis-data:
