# CI/CD — verify, build the image, release (roadmap Session 39, Doc 08 §6).
#
# Three jobs, in the order a change actually travels:
#
#   verify   every push and pull request — `nx affected` lint/test/build plus
#            the hardening battery against a real Postgres and Redis.
#   image    every push and pull request — proves `apps/iam-api/Dockerfile`
#            still builds. It does not publish: Railway builds the image it
#            deploys from `railway.json`, and CI publishing a *second* image to
#            a registry would create two artifacts with one version number.
#            Session 41 is where images become the published artifact, because
#            that is when a self-hosted install needs one it can pull.
#   release  pushes to `main` only — migrations first, over the **direct** URL,
#            then the app swap. Never on a pull request, and never in parallel
#            with itself.
#
# The ordering in `release` is the part that matters and the part that is easy
# to get wrong. Migrations run *before* the new code serves traffic, so during
# a deploy the previous version runs against the new schema. Every migration
# must therefore be backward-compatible with the release before it — expand
# now, contract a release later. `docs/ops-runbook.md` §3 spells out the
# sequence; `tools/release-migrate.ts` is what enforces the "before" half.
#
# On the services below: the battery is not a mock suite. It needs a real
# Postgres with `ltree` and a real Redis, and `rls-isolation.e2e.ts` only proves
# anything because it runs as a **non-owning** role against `force row level
# security` (Doc 07 §5.1). Collapsing the two database roles into one would
# leave a green pipeline proving nothing at all.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    services:
      postgres:
        # `ltree` and `pgcrypto` ship with the standard image; migration 0001
        # creates both extensions (Doc 07 §2).
        image: postgres:17
        env:
          POSTGRES_USER: plantops
          POSTGRES_PASSWORD: plantops
          POSTGRES_DB: plantops_iam
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U plantops -d plantops_iam"
          --health-interval 5s --health-timeout 5s --health-retries 20

      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      NODE_ENV: test
      # Two roles, not two endpoints. `plantops` owns the schema and runs the
      # migrations; `plantops_app` owns nothing and serves the requests, so the
      # policies apply to it (Doc 07 §5.1). A single-role setup would make every
      # isolation assertion pass with every policy inert.
      DATABASE_URL: postgresql://plantops_app:plantops_app@localhost:5432/plantops_iam
      DATABASE_DIRECT_URL: postgresql://plantops:plantops@localhost:5432/plantops_iam
      DATABASE_SSL: 'false'
      REDIS_URL: redis://localhost:6379
      JWT_ISSUER: plantops-iam
      JWT_SIGNING_KEY_ID: ci-key-1

    steps:
      - uses: actions/checkout@v4
        with:
          # `nx affected` compares two commits, so it needs more than the
          # shallow tip of the branch.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Derives NX_BASE / NX_HEAD: the merge-base on a pull request, and the
      # last successful run of this workflow on a push to `main`. Without it,
      # `affected` on `main` would compare against the previous commit and skip
      # work whenever a run was cancelled or a merge landed while one was
      # in flight.
      - uses: nrwl/nx-set-shas@v4

      - name: Create the application role
        # `tools/setup-db-roles.sql` is the same script a developer runs, so CI
        # and a laptop end up with the same two roles rather than with two
        # arrangements that drift. It expects the login role to exist already
        # (creating one needs CREATEROLE, which the migration role deliberately
        # does not have) — hence the CREATE ROLE ahead of it.
        env:
          PGPASSWORD: plantops
        run: |
          psql -h localhost -U plantops -d plantops_iam -v ON_ERROR_STOP=1 -c \
            "do \$\$ begin
               if not exists (select 1 from pg_roles where rolname = 'plantops_app') then
                 create role plantops_app login password 'plantops_app';
               end if;
             end \$\$;"
          psql -h localhost -U plantops -d plantops_iam \
            -v owner_role=plantops -v app_login_role=plantops_app \
            -f tools/setup-db-roles.sql

      - name: Generate a signing keypair
        # RS256, ≥2048 bits (Doc 03 §1). Generated per run and thrown away with
        # the runner: a committed key would be a committed secret, and a
        # deployment's key comes from its secret store (Doc 08 §5).
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out ci-private.pem
          openssl rsa -in ci-private.pem -pubout -out ci-public.pem
          {
            echo "JWT_PRIVATE_KEY<<PEM"; cat ci-private.pem; echo "PEM"
            echo "JWT_PUBLIC_KEY<<PEM";  cat ci-public.pem;  echo "PEM"
            echo "PLATFORM_BOOTSTRAP_SECRET=$(openssl rand -hex 32)"
          } >> "$GITHUB_ENV"

      - name: Lint, test, build (affected)
        # One invocation rather than three, so Nx schedules the whole graph at
        # once instead of draining its worker pool between phases.
        run: npx nx affected -t lint test build

      - name: OpenAPI document is current
        # `apps/iam-api/openapi.json` is committed and consumed by integrating
        # teams (Doc 06). `--check` regenerates it and fails on any difference,
        # so a route added without regenerating is caught here rather than by
        # whoever trusted the stale document.
        run: npx nx run @plantops/iam-api:openapi:check

      - name: Hardening battery
        # `e2e` depends on `@plantops/iam-api:build` and
        # `@plantops/db:migration:run`, so this one command migrates, builds,
        # boots the bundle and runs everything (roadmap Session 38).
        #
        # `affected` rather than `run-many`: the battery's project declares
        # `implicitDependencies: ["@plantops/iam-api"]`, so anything that can
        # change the API's behaviour marks it affected. A docs-only pull request
        # correctly runs nothing.
        run: npx nx affected -t e2e

      - name: Keep the API log from a failed battery
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: iam-api-e2e-log
          path: apps/iam-api-e2e/test-output/e2e/api.log
          if-no-files-found: ignore

  image:
    name: Image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build iam-api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/iam-api/Dockerfile
          # Not pushed — see the header. The point of this job is that the
          # Dockerfile is never allowed to rot: it is the only place the
          # production dependency set is resolved, and a break here is
          # invisible to every other job in this workflow.
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Release (staging)
    # Never from a pull request: a fork's PR must not be able to reach a
    # database, and `secrets` are not available to one anyway.
    #
    # And dormant until an environment actually exists. `RAILWAY_SERVICE` is
    # the switch: with no target configured this job skips rather than failing,
    # so merging the pipeline does not turn `main` red on a repository that has
    # nothing to deploy to yet. Setting the variable arms it — see
    # `docs/ops-runbook.md` §5.
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && vars.RAILWAY_SERVICE != ''
    needs: [verify, image]
    runs-on: ubuntu-latest

    # The GitHub Environment holds the secrets below and is where a required
    # reviewer is configured when staging stops being a place to experiment.
    environment: staging

    # Deployments do not overlap, and a superseded one is *not* cancelled
    # mid-flight — `cancel-in-progress` here could kill a runner between the
    # migration and the app swap, which is the one window where stopping half
    # way leaves the schema ahead of the code.
    concurrency:
      group: release-staging
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply migrations (direct URL)
        # Four variables, and no more: `release-migrate` validates the migration
        # subset of the schema, so this job never holds the signing key, the
        # Redis URL, or the bootstrap secret. It also takes a Postgres advisory
        # lock, so a re-run of a stuck job cannot race the deploy it was re-run
        # for.
        #
        # `DATABASE_CA_CERT` is a **variable**, not a secret, and deliberately.
        # It is a trust anchor — the thing verification is performed against —
        # not a credential, and GitHub masking a public certificate in the logs
        # would only make a TLS failure harder to read. It is required against a
        # managed host whose chain is not publicly rooted (Supabase's pooler is
        # one); where it is not needed, leaving the variable unset resolves to
        # the empty string, which the schema reads as absent.
        #
        # A non-zero exit here stops the workflow before the deploy step. That
        # is the whole ordering guarantee: no app swap onto a schema that failed
        # to apply.
        env:
          NODE_ENV: production
          DATABASE_DIRECT_URL: ${{ secrets.STAGING_DATABASE_DIRECT_URL }}
          DATABASE_SSL: 'true'
          DATABASE_CA_CERT: ${{ vars.STAGING_DATABASE_CA_CERT }}
          # The exception to "the release job holds no secrets", and it is
          # temporary by construction. Migration 0011 seeds the platform
          # identity by hashing this value (Doc 07 §8); it runs exactly once in
          # the life of a database and is a no-op on every release after. So
          # this secret is set for the first release of a new environment and
          # **deleted immediately afterwards** — `docs/ops-runbook.md` §6.
          #
          # Passing it unconditionally is safe: once 0011 is applied,
          # `release-migrate` never looks at the variable, and a deleted secret
          # resolves to the empty string rather than failing the expression.
          PLATFORM_BOOTSTRAP_SECRET: ${{ secrets.PLATFORM_BOOTSTRAP_SECRET }}
        run: npm run release:migrate

      - name: Deploy iam-api to Railway
        # `railway up` uploads this checkout and builds it with the
        # `railway.json` at the repository root, which pins the Dockerfile
        # builder. Railway's own GitHub auto-deploy must stay **off** for this
        # service — if it is on, a push deploys the app without waiting for the
        # migration step above, which is precisely the ordering this job exists
        # to impose (`docs/ops-runbook.md` §3).
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          npm install --global @railway/cli
          railway up \
            --service "${{ vars.RAILWAY_SERVICE }}" \
            --environment "${{ vars.RAILWAY_ENVIRONMENT }}" \
            --detach --yes

      # `admin-web` is not deployed from here. Vercel's GitHub integration
      # builds it from the root `vercel.json` on the same push, and it is safe
      # for that to race the API: the console holds no schema of its own and
      # reads everything — nav, permissions, error codes — from the API at run
      # time (Doc 05, Doc 09). See `docs/ops-runbook.md` §4.
