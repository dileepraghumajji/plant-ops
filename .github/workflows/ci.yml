# CI/CD — verify, build the image, release (roadmap Session 39, Doc 08 §6).
#
# Three jobs, in the order a change actually travels:
#
#   verify   every push and pull request — `nx affected` lint/test/build plus
#            the hardening battery against a real Postgres and Redis.
#   images   every push and pull request — builds all four release images, tags
#            them with one computed version, asserts each carries that version
#            as an OCI label, then assembles them into the single-tenant stack
#            and logs in through it (roadmap Session 41, Doc 11 §5.1).
#            It does not push. Railway builds the image it deploys from
#            `railway.json`, and CI publishing a *second* image to a registry
#            would create two artifacts with one version number; the artifact a
#            self-hosted install actually receives is the offline tarball of
#            Session 42, produced from exactly these builds.
#   release  pushes to `main` only — migrations first, over the **direct** URL,
#            then the app swap. Never on a pull request, and never in parallel
#            with itself.
#
# The ordering in `release` is the part that matters and the part that is easy
# to get wrong. Migrations run *before* the new code serves traffic, so during
# a deploy the previous version runs against the new schema. Every migration
# must therefore be backward-compatible with the release before it — expand
# now, contract a release later. `docs/ops-runbook.md` §3 spells out the
# sequence; `tools/release-migrate.ts` is what enforces the "before" half.
#
# On the services below: the battery is not a mock suite. It needs a real
# Postgres with `ltree` and a real Redis, and `rls-isolation.e2e.ts` only proves
# anything because it runs as a **non-owning** role against `force row level
# security` (Doc 07 §5.1). Collapsing the two database roles into one would
# leave a green pipeline proving nothing at all.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    services:
      postgres:
        # `ltree` and `pgcrypto` ship with the standard image; migration 0001
        # creates both extensions (Doc 07 §2).
        image: postgres:17
        env:
          POSTGRES_USER: plantops
          POSTGRES_PASSWORD: plantops
          POSTGRES_DB: plantops_iam
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U plantops -d plantops_iam"
          --health-interval 5s --health-timeout 5s --health-retries 20

      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      NODE_ENV: test
      # Two roles, not two endpoints. `plantops` owns the schema and runs the
      # migrations; `plantops_app` owns nothing and serves the requests, so the
      # policies apply to it (Doc 07 §5.1). A single-role setup would make every
      # isolation assertion pass with every policy inert.
      DATABASE_URL: postgresql://plantops_app:plantops_app@localhost:5432/plantops_iam
      DATABASE_DIRECT_URL: postgresql://plantops:plantops@localhost:5432/plantops_iam
      DATABASE_POOLED: 'false'
      DATABASE_SSL: 'disable'
      REDIS_URL: redis://localhost:6379
      JWT_ISSUER: plantops-iam
      JWT_SIGNING_KEY_ID: ci-key-1

    steps:
      - uses: actions/checkout@v4
        with:
          # `nx affected` compares two commits, so it needs more than the
          # shallow tip of the branch.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Derives NX_BASE / NX_HEAD: the merge-base on a pull request, and the
      # last successful run of this workflow on a push to `main`. Without it,
      # `affected` on `main` would compare against the previous commit and skip
      # work whenever a run was cancelled or a merge landed while one was
      # in flight.
      - uses: nrwl/nx-set-shas@v4

      - name: Create the application role
        # `tools/setup-db-roles.sql` is the same script a developer runs, so CI
        # and a laptop end up with the same two roles rather than with two
        # arrangements that drift. It expects the login role to exist already
        # (creating one needs CREATEROLE, which the migration role deliberately
        # does not have) — hence the CREATE ROLE ahead of it.
        env:
          PGPASSWORD: plantops
        run: |
          psql -h localhost -U plantops -d plantops_iam -v ON_ERROR_STOP=1 -c \
            "do \$\$ begin
               if not exists (select 1 from pg_roles where rolname = 'plantops_app') then
                 create role plantops_app login password 'plantops_app';
               end if;
             end \$\$;"
          psql -h localhost -U plantops -d plantops_iam \
            -v owner_role=plantops -v app_login_role=plantops_app \
            -f tools/setup-db-roles.sql

      - name: Generate a signing keypair
        # RS256, ≥2048 bits (Doc 03 §1). Generated per run and thrown away with
        # the runner: a committed key would be a committed secret, and a
        # deployment's key comes from its secret store (Doc 08 §5).
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out ci-private.pem
          openssl rsa -in ci-private.pem -pubout -out ci-public.pem
          {
            echo "JWT_PRIVATE_KEY<<PEM"; cat ci-private.pem; echo "PEM"
            echo "JWT_PUBLIC_KEY<<PEM";  cat ci-public.pem;  echo "PEM"
            echo "PLATFORM_BOOTSTRAP_SECRET=$(openssl rand -hex 32)"
          } >> "$GITHUB_ENV"

      - name: Lint, test, build (affected)
        # One invocation rather than three, so Nx schedules the whole graph at
        # once instead of draining its worker pool between phases.
        run: npx nx affected -t lint test build

      - name: OpenAPI document is current
        # `apps/iam-api/openapi.json` is committed and consumed by integrating
        # teams (Doc 06). `--check` regenerates it and fails on any difference,
        # so a route added without regenerating is caught here rather than by
        # whoever trusted the stale document.
        run: npx nx run @plantops/iam-api:openapi:check

      - name: Hardening battery
        # `e2e` depends on `@plantops/iam-api:build` and
        # `@plantops/db:migration:run`, so this one command migrates, builds,
        # boots the bundle and runs everything (roadmap Session 38).
        #
        # `affected` rather than `run-many`: the battery's project declares
        # `implicitDependencies: ["@plantops/iam-api"]`, so anything that can
        # change the API's behaviour marks it affected. A docs-only pull request
        # correctly runs nothing.
        #
        # The load smoke is excluded here and run separately below. Every
        # correctness suite stays in this step and stays blocking.
        run: npx nx affected -t e2e -- --testPathIgnorePatterns=load-smoke

      - name: Resolve load smoke (reported, not gating)
        # **Deliberately non-blocking, and the reasoning belongs in the open.**
        #
        # `load-smoke.e2e.ts` asserts one property — a cached resolve does not
        # read the resolution tables — by taking a delta over
        # `pg_stat_all_tables`. Those counters are global, shared with every
        # other connection, and flushed asynchronously: a backend keeps its
        # counts pending until something gives it another query, so work that
        # finished before the measurement can land inside it. The tool's own
        # header concedes as much, which is why the budget was never zero.
        #
        # On this runner it reported 44-68 scans against a budget of 30, with an
        # even spread across tables that no number of cache misses could produce
        # — a measurement artefact, not a regression. It has never reproduced
        # locally: not on CI's exact Postgres image, not under CPU throttling,
        # not at four times the concurrency, not across the full battery.
        #
        # Gating every deployment of the platform on that number would mean a
        # noisy meter can stop a release while every correctness suite is green.
        # So it runs, and it reports, and it does not block. Making the
        # measurement sound — comparing the cached delta against the uncached
        # control delta from the same run, so shared contamination cancels — is
        # tracked in `docs/ops-runbook.md` §11 and belongs to its own change.
        continue-on-error: true
        run: npx nx e2e @plantops/iam-api-e2e --testPathPatterns=load-smoke

      - name: Keep the API log from a failed battery
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: iam-api-e2e-log
          path: apps/iam-api-e2e/test-output/e2e/api.log
          if-no-files-found: ignore

  images:
    name: Images and stack
    runs-on: ubuntu-latest

    # Everything the stack needs that is not baked into an image. The two
    # passwords and the bootstrap secret are throwaway values for a database
    # that lives and dies with this runner; the signing keypair is generated
    # below, per run, for the same reason the `verify` job generates one.
    env:
      POSTGRES_PASSWORD: ci-owner-password
      PLANTOPS_APP_PASSWORD: ci-app-password
      JWT_SIGNING_KEY_ID: ci-stack-key-1
      PLANTOPS_HTTP_PORT: '8080'

    steps:
      - uses: actions/checkout@v4
        with:
          # `git describe` needs tags and history; a shallow checkout has
          # neither, and the version would silently degrade to a bare sha.
          fetch-depth: 0

      - name: Compute the release version
        id: version
        # One string for four images. Everything downstream — the tag, the OCI
        # label, `APP_VERSION` inside the container, and what `/health` reports
        # — is this value, which is what lets the smoke assert they agree
        # instead of asserting that each is individually non-empty.
        #
        # A tag when there is one, `<tag>-<n>-g<sha>` when the branch has moved
        # past it, and `0.0.0-<sha>` when the repository has no tags at all.
        # The last case is today's: it says "not a release" without pretending
        # to a number nobody cut.
        run: |
          if version=$(git describe --tags --dirty 2>/dev/null); then
            :
          else
            version="0.0.0-$(git rev-parse --short=12 HEAD)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "PLANTOPS_VERSION=$version" >> "$GITHUB_ENV"
          echo "Building version $version"

      - name: Base images are digest-pinned
        # Doc 11 §5.3 requires it, and a tag that drifts is invisible until a
        # client cannot reproduce the build we told them to reproduce. Cheaper
        # to assert here than to discover from a support ticket: every `FROM`
        # that names a registry image must carry a `@sha256:` digest.
        #
        # `${...}` FROMs are the indirection through an `ARG`, and the ARG's own
        # default is what this checks — which is where the digests actually live.
        run: |
          offenders=$(grep -rhnE '^(FROM|ARG [A-Z_]*IMAGE=)' \
            apps/iam-api/Dockerfile apps/admin-web/Dockerfile \
            deploy/proxy/Dockerfile deploy/migrate/Dockerfile \
            | grep -vE '@sha256:[0-9a-f]{64}' \
            | grep -vE 'FROM \$\{[A-Z_]+\}' \
            | grep -vE 'ARG IAM_API_IMAGE=' || true)
          if [ -n "$offenders" ]; then
            echo "::error::Base images must be pinned by digest (Doc 11 §5.3):"
            echo "$offenders"
            exit 1
          fi
          echo "All base images are digest-pinned."

      - name: Generate a signing keypair and bootstrap secret
        # Per run, thrown away with the runner. A committed key would be a
        # committed secret, and a deployment's key comes from its own secret
        # store (Doc 08 §5).
        #
        # Ahead of the builds rather than beside the stack it is for, so that
        # every later step — including the failure-only ones — has a complete
        # environment. `deploy/docker-compose.yml` marks these variables
        # required, so a `docker compose logs` run to diagnose a *build* failure
        # would otherwise fail on interpolation and print nothing, which is the
        # least helpful moment for it to do that.
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out stack-private.pem
          openssl rsa -in stack-private.pem -pubout -out stack-public.pem
          {
            echo "JWT_PRIVATE_KEY<<PEM"; cat stack-private.pem; echo "PEM"
            echo "JWT_PUBLIC_KEY<<PEM";  cat stack-public.pem;  echo "PEM"
            echo "PLATFORM_BOOTSTRAP_SECRET=$(openssl rand -hex 32)"
          } >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      # ── Build ──────────────────────────────────────────────────────────────
      #
      # `load: true` on all four, unlike before: they are not merely proved to
      # build, they are run. A separate cache scope per image so one Dockerfile's
      # churn does not evict another's layers.
      - name: Build iam-api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/iam-api/Dockerfile
          # Not pushed — see the header. What this job guarantees is that the
          # Dockerfiles are never allowed to rot: they are the only place the
          # production dependency set is resolved, and a break there is
          # invisible to every other job in this workflow.
          push: false
          load: true
          tags: plantops/iam-api:${{ steps.version.outputs.version }}
          build-args: APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=iam-api
          cache-to: type=gha,mode=max,scope=iam-api

      - name: Build admin-web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/admin-web/Dockerfile
          push: false
          load: true
          tags: plantops/admin-web:${{ steps.version.outputs.version }}
          build-args: APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=admin-web
          cache-to: type=gha,mode=max,scope=admin-web

      - name: Build proxy image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/proxy/Dockerfile
          push: false
          load: true
          tags: plantops/proxy:${{ steps.version.outputs.version }}
          build-args: APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=proxy
          cache-to: type=gha,mode=max,scope=proxy

      - name: Build migration-runner image
        # Built last and from the API image just built, which is what makes the
        # runner and the app structurally incapable of disagreeing about what a
        # migration is (`deploy/migrate/Dockerfile` explains the choice).
        #
        # **`--builder default`, and it is not optional.** The three builds above
        # run on the `docker-container` builder that `setup-buildx-action`
        # creates, which is what makes the `type=gha` cache possible — and which
        # has its own image store, entirely separate from the daemon's. A
        # `FROM plantops/iam-api:<tag>` there does not find the image the step
        # above just `load`ed into the daemon; it tries to *pull* it from Docker
        # Hub and fails with "pull access denied" on an image that was never
        # meant to be published. The `default` builder is the daemon's own, so
        # it resolves the local tag.
        #
        # The cost is no registry-backed layer cache for this one image, which
        # buys nothing anyway: it is two thin layers on a base that is already
        # local, and the expensive part — building that base — is cached above.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker buildx build \
            --builder default \
            --file deploy/migrate/Dockerfile \
            --build-arg "APP_VERSION=${VERSION}" \
            --build-arg "IAM_API_IMAGE=plantops/iam-api:${VERSION}" \
            --tag "plantops/migrate:${VERSION}" \
            --load \
            .

      - name: Every image carries the version it was tagged with
        # The label half of the stamp, readable without starting anything —
        # which is the half you need when a container will not boot. The other
        # half, what the running process reports, is asserted by the smoke below.
        run: |
          version='${{ steps.version.outputs.version }}'
          failed=0
          for image in iam-api admin-web proxy migrate; do
            label=$(docker image inspect "plantops/${image}:${version}" \
              --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')
            if [ "$label" != "$version" ]; then
              echo "::error::plantops/${image} is labelled '${label}' but tagged '${version}'"
              failed=1
            fi
          done
          [ "$failed" = '0' ] || exit 1
          echo "All four images are labelled ${version}."

      # ── Assemble and prove it works ────────────────────────────────────────
      - name: Bring the stack up
        # No `--wait`: `migrate` is a one-shot container that exits 0 when it is
        # done, and `up --wait` reports a service that exited as a failure.
        # The smoke script polls `/api/ready` through the proxy instead, which
        # is the condition that actually matters and the only one a client can
        # check from outside the stack.
        run: docker compose -f deploy/docker-compose.yml up -d

      - name: Stack smoke — login end-to-end through the proxy
        run: bash deploy/stack-smoke.sh "http://127.0.0.1:${PLANTOPS_HTTP_PORT}"

      - name: Stack logs
        # On failure only, and every service: a stack that will not serve is
        # almost always one container refusing to start for a stated reason, and
        # that reason is otherwise thrown away with the runner.
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --no-color --tail=200

      - name: Tear the development stack down
        # Before the bundle install rather than at the end of the job: the two
        # stacks want the same host port, and the offline install below is the
        # one that has to behave exactly like a customer's.
        run: docker compose -f deploy/docker-compose.yml down --volumes --remove-orphans

      # ── The offline bundle, installed the way a client installs it ──────────
      #
      # Roadmap Session 42's definition of done: a machine with the tarball and
      # nothing else ends up with a working login. A CI runner is not an
      # air-gapped plant server, so the part that cannot be simulated is
      # simulated where it counts — the four PlantOps images are **deleted** from
      # the daemon before the install, so everything the stack runs has to come
      # out of the archive, and `pull_policy: never` in the production compose
      # file means a registry is not an option even if one were reachable.
      - name: Build the offline installation bundle
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node tools/build-bundle.mjs "$VERSION"

      - name: Delete the images, so the install can only use the archive
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker image rm \
            "plantops/iam-api:$VERSION" "plantops/admin-web:$VERSION" \
            "plantops/proxy:$VERSION" "plantops/migrate:$VERSION"
          if docker image ls --format '{{.Repository}}' | grep -q '^plantops/'; then
            echo '::error::a PlantOps image survived deletion — the install below would prove nothing'
            exit 1
          fi
          echo 'No PlantOps images remain; the archive is the only source.'

      - name: Install from the bundle
        env:
          VERSION: ${{ steps.version.outputs.version }}
          # A project name of its own: this runner has just had a development
          # stack of the same name on it, and an installer that adopted those
          # volumes would be testing the wrong thing.
          PLANTOPS_COMPOSE_PROJECT: plantops-install
        run: |
          set -euo pipefail
          workdir="$RUNNER_TEMP/install"
          mkdir -p "$workdir"
          tar -xzf "dist/bundle/plantops-$VERSION.tar.gz" -C "$workdir"
          cd "$workdir/plantops-$VERSION"

          # `.env` as an operator would write it: the shipped template with every
          # REQUIRED blank filled, PEM keys on one line with their newlines
          # escaped — which is what the template tells them to do and what every
          # reader of the file accepts.
          #
          # Node rather than sed, for one specific reason: sed reads `\n` in a
          # replacement as a newline, so a PEM escaped for `.env` would be
          # un-escaped on the way through and the file would end up holding
          # exactly the multi-line values the template warns against.
          cat > fill-env.mjs <<'FILL'
          import { readFileSync, writeFileSync } from 'node:fs';

          const oneLine = (path) =>
            readFileSync(path, 'utf-8').trim().split(/\r?\n/).join('\\n');

          const workspace = process.env.GITHUB_WORKSPACE;
          const answers = {
            POSTGRES_PASSWORD: 'ci-owner-password',
            PLANTOPS_APP_PASSWORD: 'ci-app-password',
            JWT_SIGNING_KEY_ID: 'ci-install-key-1',
            JWT_PRIVATE_KEY: oneLine(workspace + '/stack-private.pem'),
            JWT_PUBLIC_KEY: oneLine(workspace + '/stack-public.pem'),
            PLATFORM_BOOTSTRAP_SECRET: process.env.PLATFORM_BOOTSTRAP_SECRET,
            PLANTOPS_CLIENT_NAME: 'Northgate Foods',
            // Twice, because the installer refuses to proceed if the
            // organisation it creates and the one the application is pinned to
            // disagree (Session 44). Written from one constant here for the
            // same reason an operator is told to copy the value: the check is
            // only worth having while both are real.
            PLANTOPS_CLIENT_SLUG: 'northgate',
            SINGLE_TENANT_CLIENT_SLUG: 'northgate',
            PLANTOPS_ADMIN_EMAIL: 'ops@northgate.example',
            PLANTOPS_ADMIN_NAME: 'Northgate Operations',
            PLANTOPS_ADMIN_PASSWORD: 'first-admin-password-1',
            PLANTOPS_HTTP_PORT: '8081',
          };

          let env = readFileSync('.env.template', 'utf-8');
          for (const [key, value] of Object.entries(answers)) {
            const line = new RegExp('^' + key + '=.*$', 'm');
            if (!line.test(env)) throw new Error(key + ' is not in .env.template');
            env = env.replace(line, () => key + '=' + value);
          }
          writeFileSync('.env', env);
          FILL
          node fill-env.mjs
          rm fill-env.mjs

          ./bootstrap.sh

      - name: The install is idempotent, and its credential can be retired
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PLANTOPS_COMPOSE_PROJECT: plantops-install
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/install/plantops-$VERSION"

          # Twice, changing nothing. The realistic reason to run an installer a
          # second time is that the first attempt died after this point.
          ./bootstrap.sh | tee second-run.log
          grep -q 'already exists' second-run.log

          # The one-time credential is retired by the installer itself, and the
          # installation stays healthy without it — the state Doc 07 §8 asks
          # every deployment to reach, and the one a real install is left in.
          ./bootstrap.sh --rotate-platform-secret
          sed -i 's|^PLATFORM_BOOTSTRAP_SECRET=.*|# PLATFORM_BOOTSTRAP_SECRET removed|' .env
          ./bootstrap.sh --verify

          # And the API never held it in the first place.
          held=$(docker compose --project-name plantops-install --env-file .env \
            exec -T iam-api printenv PLATFORM_BOOTSTRAP_SECRET || true)
          if [ -n "$held" ]; then
            echo '::error::the API container received PLATFORM_BOOTSTRAP_SECRET'
            exit 1
          fi
          echo 'The API container holds no bootstrap secret.'

      - name: Installation logs
        if: failure()
        continue-on-error: true
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd "$RUNNER_TEMP/install/plantops-$VERSION" || exit 0
          docker compose --project-name plantops-install --env-file .env \
            logs --no-color --tail=200

      - name: Tear the installation down
        if: always()
        continue-on-error: true
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd "$RUNNER_TEMP/install/plantops-$VERSION" || exit 0
          docker compose --project-name plantops-install --env-file .env \
            down --volumes --remove-orphans

      - name: Tear the stack down
        # `always()`, and never able to turn a green run red: there is nothing
        # useful a failed cleanup can tell you about a runner that is about to
        # be destroyed anyway.
        if: always()
        continue-on-error: true
        run: docker compose -f deploy/docker-compose.yml down --volumes --remove-orphans

  release:
    name: Release (staging)
    # Never from a pull request: a fork's PR must not be able to reach a
    # database, and `secrets` are not available to one anyway.
    #
    # This condition deliberately does **not** test whether the deploy target is
    # configured, and that is worth stating because the obvious version is
    # broken. A job's `environment:` is resolved *after* its `if:` is evaluated,
    # so `vars` here sees only **repository**-level variables — an
    # environment-scoped `RAILWAY_SERVICE` reads as the empty string no matter
    # how correctly it is set. The guard that used to live here therefore
    # skipped this job silently on every push, with a green tick and no deploy,
    # which is the worst way for a pipeline to do nothing.
    #
    # Configuration is checked in the first step below instead, where the
    # environment exists and a missing value can say so out loud.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, images]
    runs-on: ubuntu-latest

    # The GitHub Environment holds the secrets below and is where a required
    # reviewer is configured when staging stops being a place to experiment.
    environment: staging

    # A backstop, not a budget. The first real release applied its migrations in
    # under a minute and then sat for twenty-three, because the tool had finished
    # its work but the process would not exit — the deploy behind it never ran,
    # and it took a human noticing to end it. `release-migrate` now bounds its
    # own shutdown; this bounds everything else, including `railway up`.
    timeout-minutes: 20

    # Deployments do not overlap, and a superseded one is *not* cancelled
    # mid-flight — `cancel-in-progress` here could kill a runner between the
    # migration and the app swap, which is the one window where stopping half
    # way leaves the schema ahead of the code.
    concurrency:
      group: release-staging
      cancel-in-progress: false

    steps:
      - name: Check the deploy target is configured
        # Fails loudly and names what is missing, rather than deploying half a
        # release or skipping in silence. Values are only tested for presence —
        # nothing is echoed, because two of them are secrets.
        env:
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
          RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_ENVIRONMENT }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          DATABASE_DIRECT_URL: ${{ secrets.STAGING_DATABASE_DIRECT_URL }}
        run: |
          missing=()
          for name in RAILWAY_SERVICE RAILWAY_ENVIRONMENT RAILWAY_TOKEN DATABASE_DIRECT_URL; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Release environment incomplete — missing: ${missing[*]}."
            echo "Set them on the GitHub Environment named by this job (docs/ops-runbook.md §2)."
            exit 1
          fi
          echo "Deploying to service '$RAILWAY_SERVICE' in environment '$RAILWAY_ENVIRONMENT'."

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply migrations (direct URL)
        # Four variables, and no more: `release-migrate` validates the migration
        # subset of the schema, so this job never holds the signing key, the
        # Redis URL, or the bootstrap secret. It also takes a Postgres advisory
        # lock, so a re-run of a stuck job cannot race the deploy it was re-run
        # for.
        #
        # `DATABASE_CA_CERT` is a **variable**, not a secret, and deliberately.
        # It is a trust anchor — the thing verification is performed against —
        # not a credential, and GitHub masking a public certificate in the logs
        # would only make a TLS failure harder to read. It is required against a
        # managed host whose chain is not publicly rooted (Supabase's pooler is
        # one); where it is not needed, leaving the variable unset resolves to
        # the empty string, which the schema reads as absent.
        #
        # A non-zero exit here stops the workflow before the deploy step. That
        # is the whole ordering guarantee: no app swap onto a schema that failed
        # to apply.
        env:
          NODE_ENV: production
          DATABASE_DIRECT_URL: ${{ secrets.STAGING_DATABASE_DIRECT_URL }}
          DATABASE_SSL: 'verify-full'
          DATABASE_CA_CERT: ${{ vars.STAGING_DATABASE_CA_CERT }}
          # The exception to "the release job holds no secrets", and it is
          # temporary by construction. Migration 0011 seeds the platform
          # identity by hashing this value (Doc 07 §8); it runs exactly once in
          # the life of a database and is a no-op on every release after. So
          # this secret is set for the first release of a new environment and
          # **deleted immediately afterwards** — `docs/ops-runbook.md` §6.
          #
          # Passing it unconditionally is safe: once 0011 is applied,
          # `release-migrate` never looks at the variable, and a deleted secret
          # resolves to the empty string rather than failing the expression.
          PLATFORM_BOOTSTRAP_SECRET: ${{ secrets.PLATFORM_BOOTSTRAP_SECRET }}
        run: npm run release:migrate

      - name: Deploy iam-api to Railway
        # `railway up` uploads this checkout and builds it with the
        # `railway.json` at the repository root, which pins the Dockerfile
        # builder. Railway's own GitHub auto-deploy must stay **off** for this
        # service — if it is on, a push deploys the app without waiting for the
        # migration step above, which is precisely the ordering this job exists
        # to impose (`docs/ops-runbook.md` §3).
        #
        # **Not `--detach`, and that is the point of this step.** Detached,
        # `railway up` returns 0 as soon as the tarball is uploaded — before the
        # image is built, let alone deployed. A Dockerfile that Railway's
        # builder rejects then fails minutes later while this workflow has
        # already gone green, which is a pipeline reporting success for work it
        # never observed. Attached, the CLI streams the build and exits non-zero
        # when it fails, so a red run means a failed deploy and a green one
        # means the service actually took the image.
        #
        # Attached means this step waits, so it depends on the job's
        # `timeout-minutes` above to bound a build wedged on Railway's side —
        # without that backstop this would hold the runner, and the
        # `release-staging` concurrency group with it, for six hours.
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          npm install --global @railway/cli
          railway up \
            --service "${{ vars.RAILWAY_SERVICE }}" \
            --environment "${{ vars.RAILWAY_ENVIRONMENT }}" \
            --yes

      # `admin-web` is not deployed from here. Vercel's GitHub integration
      # builds it from the root `vercel.json` on the same push, and it is safe
      # for that to race the API: the console holds no schema of its own and
      # reads everything — nav, permissions, error codes — from the API at run
      # time (Doc 05, Doc 09). See `docs/ops-runbook.md` §4.
